name: release

# Versioned releases per component on the production branch.
# release-please keeps one release PR per component open on prd; merging it
# tags app-vX.Y.Z or backend-vX.Y.Z. An app release also starts the store
# workflow. The back-merge lives here rather than in a workflow triggered
# by the release, because events caused by the default GITHUB_TOKEN start
# no new workflow run.
on:
  push:
    branches: [prd]

permissions: {}

# Concurrency is per job, not per workflow: the store job can wait days for
# approval, and later prd pushes must still cut releases and back-merge.
jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      app_release_created: ${{ steps.release.outputs['app--release_created'] }}
      app_tag: ${{ steps.release.outputs['app--tag_name'] }}
    steps:
      # The App's token, when RELEASE_APP_CLIENT_ID is set, lets the release PR
      # start CI (the default token's PRs do not) and makes
      # its commits <app>[bot] ones, which the dco check exempts.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: prd
          token: ${{ steps.app-token.outputs.token || github.token }}

  # Runs on every push to prd, release or not: a hotfix that cuts no
  # release must still flow down. The script skips targets already level.
  back-merge:
    needs: [release]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Open the back-merge PRs from prd into stg and dev
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: sh scripts/back-merge.sh

  # A new app version goes to Play internal testing and TestFlight; the
  # store workflow holds the production step for the maintainer. Its jobs
  # read the store secrets from their own environments, which a called
  # workflow only receives when the caller inherits secrets.
  store:
    needs: [release]
    if: ${{ needs.release.outputs.app_release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/store.yml
    with:
      tag: ${{ needs.release.outputs.app_tag }}
    secrets: inherit
