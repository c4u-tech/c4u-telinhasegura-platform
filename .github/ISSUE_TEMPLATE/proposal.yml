name: Proposal
description: Suggest a feature or a change, before writing the code.
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who has it (guardian, child, reviewer, contributor) and when.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: principles
    attributes:
      label: Product principles
      options:
        - label: I have read the Principles in the README (a bounded set, never a feed, streak or time counter).
          required: true
