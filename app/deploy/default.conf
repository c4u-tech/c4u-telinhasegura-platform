# The web app's server. The headers and
# /config.json are rendered at start into /tmp/telinha by render-config.sh.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    etag on;
    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    include /tmp/telinha/headers.conf;

    location = /config.json {
        default_type application/json;
        alias /tmp/telinha/config.json;
    }

    # A path with no file is a route of the app.
    location / {
        try_files $uri /index.html;
    }
}
