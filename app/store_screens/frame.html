<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Telinha Segura: store screenshot frame</title>
  <!--
    One store screenshot: a caption over a real screen of the app, held in
    a device bezel that runs off the bottom edge. compose.sh renders it with
    headless Chrome, sized and filled by the query string:

      w, h      canvas size in pixels (the store size)
      device    "phone" or "tablet": the bezel drawn around the screen
      caption   the line above the screen
      captions  every caption of the set, one per line: the screen starts
                below the tallest of them, so the frames of one size line
                up side by side in a listing
      shot      file URL of the raw capture of the screen
      crop      optional "x0,y0,x1": the part of the capture to show, as
                fractions of its width and height; it runs to the bottom of
                the capture, and the default "0,0,1" shows all of it

    Every measure is a proportion of the canvas, so one layout serves the
    phone, the tablet and the iPad sizes. The crop only zooms into the real
    capture, so a frame can show the part of the screen its caption is about.
    If the brand font or the capture fails to fill the frame, the page stays
    blank, so the render is caught instead of shipping a fallback.
  -->
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("../../site/public/fonts/bricolage-grotesque.woff2") format("woff2");
      font-weight: 300 800;
    }

    :root {
      --ink: #1E5B66;
      --cream: #FBF6EC;
      --dark: #0F2A30;
      /* The dark theme's outline tone: a hairline inside the bezel keeps
         the edge of a screen whose ground is the bezel's own colour. */
      --outline: #6A8D93;
      --edge: color-mix(in srgb, var(--outline) 55%, transparent);
    }

    html,
    body {
      margin: 0;
      overflow: hidden;
      background: var(--ink);
    }

    .frame {
      position: relative;
      overflow: hidden;
      background: var(--ink);
    }

    h1 {
      position: absolute;
      margin: 0;
      text-align: center;
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.015em;
      color: var(--cream);
      text-wrap: balance;
    }

    .measure {
      visibility: hidden;
    }

    .device {
      position: absolute;
      box-sizing: border-box;
      background: var(--dark);
    }

    .screen {
      position: relative;
      overflow: hidden;
      height: 100%;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 var(--hairline) var(--edge);
      pointer-events: none;
    }

    .screen img {
      position: absolute;
      display: block;
      max-width: none;
    }

    .blank > * {
      display: none;
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1></h1>
    <div class="device"><div class="screen"><img alt=""></div></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const w = Number(q.get("w"));
    const h = Number(q.get("h"));
    const [x0, y0, x1] = (q.get("crop") || "0,0,1").split(",").map(Number);
    // The iPad canvas is squarer than a phone's: a narrower screen and a
    // caption set in a narrower measure keep the same balance on it. The
    // Play tablet set is 9:16 like the phones, so it takes the phone
    // measures, though its screen sits in a tablet's bezel.
    const square = h / w < 1.7;

    const frame = document.querySelector(".frame");
    const title = document.querySelector("h1");
    const device = document.querySelector(".device");
    const screen = document.querySelector(".screen");
    const shot = document.querySelector("img");

    document.body.style.width = frame.style.width = w + "px";
    document.body.style.height = frame.style.height = h + "px";

    title.textContent = q.get("caption");
    const side = (square ? 0.12 : 0.07) * w;
    const fontSize = (square ? 0.058 : 0.064) * w;
    title.style.left = title.style.right = side + "px";
    title.style.fontSize = fontSize + "px";

    // The bezel follows a phone's proportions: a border about a thirtieth
    // of the device's width and corners about a seventh of it. A tablet's
    // border and corners are thinner in proportion to its wider face.
    const deviceW = (square ? 0.80 : 0.84) * w;
    const tablet = q.get("device") === "tablet";
    const border = (tablet ? 0.022 : 0.033) * deviceW;
    const radius = (tablet ? 0.06 : 0.147) * deviceW;
    const cardW = deviceW - 2 * border;
    device.style.width = deviceW + "px";
    device.style.left = (w - deviceW) / 2 + "px";
    device.style.padding = `${border}px ${border}px 0`;
    // The device runs off the bottom edge: only its top corners show.
    device.style.borderRadius = `${radius}px ${radius}px 0 0`;
    device.style.boxShadow = `0 ${0.02 * w}px ${0.06 * w}px rgba(15, 42, 48, .35)`;
    screen.style.borderRadius = `${radius - border}px ${radius - border}px 0 0`;
    screen.style.setProperty("--hairline", Math.max(1, 0.0016 * w) + "px");

    // The tallest caption of the set, set the same way as this one.
    function tallest() {
      const all = (q.get("captions") || q.get("caption")).split("\n")
        .filter((c) => c.trim() !== "");
      let most = 0;
      for (const c of all) {
        const probe = title.cloneNode();
        probe.classList.add("measure");
        probe.textContent = c;
        frame.appendChild(probe);
        most = Math.max(most, probe.getBoundingClientRect().height);
        probe.remove();
      }
      return most;
    }

    function fail() {
      frame.classList.add("blank");
    }

    function layout() {
      const brand = '700 10px "Bricolage Grotesque"';
      const loaded = [...document.fonts].some(
        (f) => f.family.includes("Bricolage Grotesque") && f.status === "loaded");
      if (!loaded || !document.fonts.check(brand)) {
        return fail();
      }
      const top = 0.08 * h;
      const gap = 0.04 * h;
      // The device runs a little past the bottom edge, so no sliver of
      // ground shows under it.
      const cut = 0.01 * h;
      title.style.top = top + "px";
      const deviceTop = top + tallest() + gap;
      const cardH = h - deviceTop - border + cut;
      const imgW = cardW / (x1 - x0);
      const imgH = imgW * shot.naturalHeight / shot.naturalWidth;
      // The capture must fill the card down past the edge; a crop that
      // leaves a gap would show the ground under the screen.
      if ((1 - y0) * imgH < cardH) {
        return fail();
      }
      device.style.top = deviceTop + "px";
      device.style.height = cardH + border + "px";
      shot.style.width = imgW + "px";
      shot.style.left = -x0 * imgW + "px";
      shot.style.top = -y0 * imgH + "px";
    }

    shot.addEventListener("error", fail);
    shot.addEventListener("load", () =>
      document.fonts.load('700 10px "Bricolage Grotesque"')
        .then(() => document.fonts.ready)
        .then(layout, fail));
    shot.src = q.get("shot");
  </script>
</body>
</html>
