<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Telinha Segura: Play feature graphic</title>
  <!--
    The Google Play feature graphic, 1024x500: the link preview card's
    composition at the Play size. compose.sh renders it with headless Chrome.
    Play may crop the edges and lay its own button over the middle, so the
    headline stays inside the central 600 px. If the brand font does not
    load, the page stays blank, so the render is caught instead of shipping
    a fallback.
  -->
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("../../site/public/fonts/bricolage-grotesque.woff2") format("woff2");
      font-weight: 300 800;
    }

    :root {
      --ink: #1E5B66;
      --sun: #F2B23A;
      --cream: #FBF6EC;
    }

    html,
    body {
      margin: 0;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: var(--ink);
    }

    .card {
      position: relative;
      width: 1024px;
      height: 500px;
      overflow: hidden;
    }

    h1 {
      position: absolute;
      top: 38px;
      left: 212px;
      right: 212px;
      margin: 0;
      text-align: center;
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 700;
      font-size: 62px;
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--cream);
    }

    .blank > * {
      display: none;
    }

    h1 span {
      display: block;
      white-space: nowrap;
    }

    /* The telinha runs off the bottom edge: only the head, the fingers
       and the top of the screen show, so the mark peeks into the card. */
    .mark {
      position: absolute;
      left: 352px;
      top: 270px;
      width: 320px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>Vídeos escolhidos</span><span>por gente,</span><span>não por algoritmo</span></h1>
    <!-- The Espiadinha: the head and fingers peek over an empty telinha. -->
    <svg class="mark" viewBox="2 4 60 57" aria-hidden="true">
      <path fill="#FBF6EC" d="M13 27H51A10 10 0 0 1 61 37V50A10 10 0 0 1 51 60H13A10 10 0 0 1 3 50V37A10 10 0 0 1 13 27Z"/>
      <path fill="#F2B23A" d="M19.126 24.5A14 14 0 1 1 44.874 24.5Z"/>
      <path fill="#F2B23A" d="M7.753 24.5A2.15 2.15 0 1 1 11.447 24.5ZM11.553 24.5A2.15 2.15 0 1 1 15.247 24.5ZM15.353 24.5A2.15 2.15 0 1 1 19.047 24.5ZM44.953 24.5A2.15 2.15 0 1 1 48.647 24.5ZM48.753 24.5A2.15 2.15 0 1 1 52.447 24.5ZM52.553 24.5A2.15 2.15 0 1 1 56.247 24.5Z"/>
      <ellipse fill="#0F2A30" cx="26.5" cy="17" rx="2.6" ry="3.2"/>
      <ellipse fill="#0F2A30" cx="37.5" cy="17" rx="2.6" ry="3.2"/>
    </svg>
  </div>
  <script>
    const brand = '700 10px "Bricolage Grotesque"';
    const card = document.querySelector(".card");
    card.classList.add("blank");
    document.fonts.load(brand).then(() => document.fonts.ready).then(() => {
      const loaded = [...document.fonts].some(
        (f) => f.family.includes("Bricolage Grotesque") && f.status === "loaded");
      if (loaded && document.fonts.check(brand)) {
        card.classList.remove("blank");
      }
    });
  </script>
</body>
</html>
