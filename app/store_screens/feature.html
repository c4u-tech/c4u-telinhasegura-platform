<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Telinha Segura: Play feature graphic</title>
  <!--
    The Google Play feature graphic, 1024x500: the link preview card's
    composition at the Play size. compose.sh renders it with headless Chrome.
    The headline and the mascot are the generated brand drawings and the
    brand font, kept well inside the edges, which Play may crop; only the
    wire and the row of the brand pattern run off them. The app's name
    already sits under the image in the listing, so the wordmark stays out.
    If the brand font or a drawing does not load, the page stays blank, so
    the render is caught instead of shipping a fallback.
  -->
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("../../site/public/fonts/bricolage-grotesque.woff2") format("woff2");
      font-weight: 300 800;
    }

    :root {
      --ink: #1E5B66;
      --sun: #FFC42E;
      --cream: #FBF6EC;
      --dark: #0F2A30;
    }

    html,
    body {
      margin: 0;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: var(--ink);
    }

    .card {
      position: relative;
      width: 1024px;
      height: 500px;
      overflow: hidden;
    }

    .blank > * {
      display: none;
    }

    h1 {
      position: absolute;
      top: 110px;
      left: 76px;
      margin: 0;
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: 68px;
      line-height: 1;
      letter-spacing: -0.035em;
      color: var(--cream);
    }

    h1 span {
      display: block;
      white-space: nowrap;
    }

    h1 em {
      font-style: normal;
      color: var(--sun);
    }

    /* The mascot perched on a wire, looking back at the words. */
    .wire {
      position: absolute;
      left: 630px;
      right: -20px;
      top: 327px;
      height: 5px;
      border-radius: 3px;
      background: var(--dark);
    }

    .mascot {
      position: absolute;
      left: 650px;
      top: 72px;
      width: 312px;
      height: 312px;
    }

    /* One row of the brand pattern along the bottom edge. */
    .pattern {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 80px;
      background: url("../../site/public/brand/telinha-segura-pattern-row.svg") left center / auto 80px repeat-x;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>Vídeos escolhidos</span><span>por <em>gente</em>, não</span><span>por algoritmo</span></h1>
    <div class="wire"></div>
    <img class="mascot" src="../../site/public/brand/telinha-segura-mark-looking-back-color.svg" alt="">
    <div class="pattern"></div>
  </div>
  <script>
    const brand = '800 10px "Bricolage Grotesque"';
    const card = document.querySelector(".card");
    const mascot = document.querySelector(".mascot");
    card.classList.add("blank");
    const drawn = mascot.complete
      ? Promise.resolve(mascot.naturalWidth > 0)
      : new Promise((done) => {
        mascot.addEventListener("load", () => done(true));
        mascot.addEventListener("error", () => done(false));
      });
    Promise.all([document.fonts.load(brand).then(() => document.fonts.ready), drawn])
      .then(([, ok]) => {
        const loaded = [...document.fonts].some(
          (f) => f.family.includes("Bricolage Grotesque") && f.status === "loaded");
        if (ok && loaded && document.fonts.check(brand)) {
          card.classList.remove("blank");
        }
      });
  </script>
</body>
</html>
