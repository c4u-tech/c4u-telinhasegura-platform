<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vídeos para crianças escolhidos por pais, cuidadores e quem trabalha com crianças.">
  <meta name="theme-color" content="#1E5B66">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Telinha Segura">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon: favicon.svg follows prefers-color-scheme (brand/favicon). -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">

  <title>Telinha Segura</title>
  <link rel="manifest" href="manifest.json">
  <!-- Apple JS is not loaded here: lib/auth/apple_js_web.dart injects it
       on the first Apple sign-in. -->
  <style>
    html, body { background: #FBF6EC; margin: 0; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F2A30; } }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
