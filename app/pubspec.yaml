name: telinha_segura
description: "Telinha Segura: vídeos escolhidos por quem cuida de crianças."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.5

dependencies:
  clock: ^1.1.3
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  http: ^1.6.0
  qr: ^4.0.0
  share_plus: ^13.3.1
  sign_in_with_apple: ^8.2.0
  url_launcher: ^6.3.3
  web: ^1.1.1
  webview_flutter: ^4.14.1
  youtube_player_iframe: ^6.0.2
  # Pinned: the kid player restricts the frame this package builds through
  # one of its internals. An upgrade must re-run the browser test in
  # test/kid/kid_frame_browser_test.dart before it lands.
  youtube_player_iframe_web: 3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  google_sign_in_platform_interface: ^3.1.0
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    # Bricolage Grotesque (SIL OFL, assets/fonts/OFL.txt), variable on
    # opsz/wdth/wght; styles pick their axes with fontVariations.
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
