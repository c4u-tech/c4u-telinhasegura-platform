<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Telinha Segura: link preview card</title>
  <!--
    The source of site/public/og/telinha-segura.png, the image a link to the
    site shows when it is shared. It is not served, so it may use a <style>
    block. Render it at 1200x630:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --screenshot=site/public/og/telinha-segura.png "file://$PWD/site/og/card.html"
  -->
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("../public/fonts/bricolage-grotesque.woff2") format("woff2");
      font-weight: 300 800;
    }

    :root {
      --ink: #1E5B66;
      --sun: #FFC42E;
      --cream: #FBF6EC;
      --dark: #0F2A30;
    }

    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--ink);
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .wordmark {
      position: absolute;
      top: 64px;
      left: 72px;
      height: 40px;
    }

    h1 {
      position: absolute;
      top: 150px;
      left: 72px;
      margin: 0;
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: 82px;
      line-height: 1;
      letter-spacing: -0.035em;
      color: var(--cream);
    }

    h1 span {
      display: block;
      white-space: nowrap;
    }

    h1 em {
      font-style: normal;
      color: var(--sun);
    }

    /* The mascot perched on a wire, looking back at the words. */
    .wire {
      position: absolute;
      left: 760px;
      right: -20px;
      top: 414px;
      height: 6px;
      border-radius: 3px;
      background: var(--dark);
    }

    .mascot {
      position: absolute;
      left: 800px;
      top: 104px;
      width: 380px;
      height: 380px;
    }

    /* One row of the brand pattern along the bottom edge. */
    .pattern {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 96px;
      background: url("../public/brand/telinha-segura-pattern-row.svg") left center / auto 96px repeat-x;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="wordmark" src="../public/brand/telinha-segura-wordmark-reversed.svg" alt="">
    <h1><span>Vídeos escolhidos</span><span>por <em>gente</em>, não</span><span>por algoritmo</span></h1>
    <div class="wire"></div>
    <img class="mascot" src="../public/brand/telinha-segura-mark-looking-back-color.svg" alt="">
    <div class="pattern"></div>
  </div>
</body>
</html>
