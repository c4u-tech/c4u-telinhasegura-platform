<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Telinha Segura: link preview card</title>
  <!--
    The source of site/public/og/telinha-segura.png, the image a link to the
    site shows when it is shared. It is not served. Render it at 1200x630:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --screenshot=site/public/og/telinha-segura.png "file://$PWD/site/og/card.html"
  -->
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("../public/fonts/bricolage-grotesque.woff2") format("woff2");
      font-weight: 300 800;
    }

    :root {
      --ink: #1E5B66;
      --sun: #F2B23A;
      --cream: #FBF6EC;
    }

    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--ink);
    }

    .card {
      box-sizing: border-box;
      width: 1200px;
      height: 630px;
      padding: 60px;
      display: flex;
      align-items: center;
      gap: 56px;
    }

    .mark {
      flex: none;
      width: 240px;
      height: auto;
    }

    .words {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 44px;
    }

    h1 {
      margin: 0;
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 700;
      font-size: 61px;
      line-height: 1.06;
      letter-spacing: -0.015em;
      color: var(--cream);
    }

    h1 span {
      display: block;
      white-space: nowrap;
    }

    .lockup {
      display: block;
      align-self: flex-start;
      height: 44px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- The Espiadinha: the head and fingers peek over an empty telinha. -->
    <svg class="mark" viewBox="2 4 60 57" aria-hidden="true">
      <path fill="#FBF6EC" d="M13 27H51A10 10 0 0 1 61 37V50A10 10 0 0 1 51 60H13A10 10 0 0 1 3 50V37A10 10 0 0 1 13 27Z"/>
      <path fill="#F2B23A" d="M19.126 24.5A14 14 0 1 1 44.874 24.5Z"/>
      <path fill="#F2B23A" d="M7.753 24.5A2.15 2.15 0 1 1 11.447 24.5ZM11.553 24.5A2.15 2.15 0 1 1 15.247 24.5ZM15.353 24.5A2.15 2.15 0 1 1 19.047 24.5ZM44.953 24.5A2.15 2.15 0 1 1 48.647 24.5ZM48.753 24.5A2.15 2.15 0 1 1 52.447 24.5ZM52.553 24.5A2.15 2.15 0 1 1 56.247 24.5Z"/>
      <ellipse fill="#1E5B66" cx="26.5" cy="17" rx="2.6" ry="3.2"/>
      <ellipse fill="#1E5B66" cx="37.5" cy="17" rx="2.6" ry="3.2"/>
    </svg>
    <div class="words">
      <h1><span>Vídeos escolhidos por gente,</span><span>não por algoritmo</span></h1>
      <img class="lockup" src="../public/brand/telinha-segura-lockup-reversed.svg" alt="Telinha Segura">
    </div>
  </div>
</body>
</html>
